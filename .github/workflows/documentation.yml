name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**/*.cs'
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'

    - name: Generate API documentation
      run: |
        dotnet tool install -g docfx
        docfx docs/docfx.json

    - name: Install frontend dependencies
      working-directory: src/DooLittle.Health.PatientTimeline.Web
      run: npm ci

    - name: Generate Storybook documentation
      working-directory: src/DooLittle.Health.PatientTimeline.Web
      run: |
        npm run storybook:build
        # Additional documentation generation steps here

    - name: Update README badges
      run: |
        # Update build status, coverage, etc. badges in README
        # This could use a tool like readme-badger or custom script

    - name: Deploy documentation
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_site
        cname: docs.patient-timeline.doolittle.health

    - name: Create documentation PR (if changes)
      if: github.ref == 'refs/heads/main'
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "docs: update generated documentation"
        title: "Update Generated Documentation"
        body: |
          This PR updates the generated documentation.

          ## Changes
          - Updated API documentation
          - Updated Storybook docs
          - Updated README badges

          This PR was automatically generated.
        branch: automated/docs-update
        delete-branch: true
        labels: |
          documentation
          automated