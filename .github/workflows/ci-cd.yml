name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'

jobs:
  # Build and test .NET API
  build-api:
    name: Build .NET API
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore DooLittle.Health.PatientTimeline.sln

    - name: Build
      run: dotnet build DooLittle.Health.PatientTimeline.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test DooLittle.Health.PatientTimeline.sln --configuration Release --no-build --verbosity normal

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: api-build
        path: |
          src/DooLittle.Health.PatientTimeline.Api/bin/Release/
        retention-days: 7

  # Build and test React frontend
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/DooLittle.Health.PatientTimeline.Web/package-lock.json

    - name: Install dependencies
      working-directory: src/DooLittle.Health.PatientTimeline.Web
      run: npm ci

    - name: Lint code
      working-directory: src/DooLittle.Health.PatientTimeline.Web
      run: npm run lint

    - name: Build
      working-directory: src/DooLittle.Health.PatientTimeline.Web
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: frontend-build
        path: |
          src/DooLittle.Health.PatientTimeline.Web/dist/
        retention-days: 7

  # Build Docker images
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-api, build-frontend]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download API build
      uses: actions/download-artifact@v4
      with:
        name: api-build
        path: api-artifacts/

    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: frontend-artifacts/

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build API Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deployments/docker/Dockerfile.api
        push: false
        tags: patient-timeline-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Web Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deployments/docker/Dockerfile.web
        push: false
        tags: patient-timeline-web:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Check .NET code formatting
      run: |
        dotnet tool install -g dotnet-format
        dotnet format --verify-no-changes DooLittle.Health.PatientTimeline.sln

    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified