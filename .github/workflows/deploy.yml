name: Deploy to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  AZURE_WEBAPP_NAME: patient-timeline-${{ github.event.inputs.environment || 'staging' }}
  AZURE_RESOURCE_GROUP: rg-patient-timeline-${{ github.event.inputs.environment || 'staging' }}-001

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'

    - name: Build .NET API
      run: dotnet publish src/DooLittle.Health.PatientTimeline.Api/DooLittle.Health.PatientTimeline.Api.csproj --configuration Release --output ./api-publish

    - name: Build React Frontend
      working-directory: src/DooLittle.Health.PatientTimeline.Web
      run: |
        npm ci
        npm run build

    - name: Deploy API to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}-api
        package: ./api-publish

    - name: Deploy Web to Azure Static Web App
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: "upload"
        app_location: "src/DooLittle.Health.PatientTimeline.Web"
        output_location: "dist"
        skip_app_build: true

    - name: Run database migrations (if needed)
      run: |
        # Add database migration commands here if needed
        echo "Database migrations would run here"

    - name: Health check
      run: |
        # Add health check logic here
        echo "Health check would run here"