name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 8 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'

    - name: Update .NET dependencies
      run: |
        dotnet outdated --upgrade
        dotnet restore

    - name: Update Node.js dependencies
      working-directory: src/DooLittle.Health.PatientTimeline.Web
      run: |
        npm update
        npm audit fix

    - name: Run tests after updates
      run: dotnet test --configuration Release

    - name: Run frontend tests after updates
      working-directory: src/DooLittle.Health.PatientTimeline.Web
      run: npm test -- --watchAll=false

    - name: Create pull request
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update dependencies"
        title: "Automated Dependency Updates"
        body: |
          This PR updates project dependencies to their latest versions.

          ## Changes
          - Updated .NET packages
          - Updated Node.js packages
          - Fixed security vulnerabilities (if any)

          ## Testing
          - All tests pass after updates
          - No breaking changes detected

          Please review and merge if appropriate.
        branch: automated/dependency-updates
        delete-branch: true
        labels: |
          dependencies
          automated