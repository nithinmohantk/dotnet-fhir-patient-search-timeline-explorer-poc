name: Performance Monitoring

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: patient_timeline_perf
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Build .NET solution
      run: dotnet build --configuration Release

    - name: Run .NET performance benchmarks
      run: |
        dotnet tool install -g BenchmarkDotNet.Tool
        dotnet benchmark --configuration Release --filter "*"

    - name: Install frontend dependencies
      working-directory: src/DooLittle.Health.PatientTimeline.Web
      run: npm ci

    - name: Build React app for production
      working-directory: src/DooLittle.Health.PatientTimeline.Web
      run: npm run build

    - name: Run Lighthouse performance audit
      uses: treosh/lighthouse-ci-action@v10
      with:
        urls: |
          http://localhost:3000
        configPath: .lighthouserc.json
        uploadArtifacts: true
        temporaryPublicStorage: true

    - name: Run bundle analyzer
      working-directory: src/DooLittle.Health.PatientTimeline.Web
      run: |
        npm install -g webpack-bundle-analyzer
        npx webpack-bundle-analyzer dist/static/js/*.js --mode static --report dist/bundle-report.html

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: |
          BenchmarkDotNet.Artifacts/
          dist/bundle-report.html
          .lighthouseci/

    - name: Comment performance results on PR
      if: github.event_name == 'pull_request'
      uses: dorny/test-reporter@v1
      with:
        name: Performance Results
        path: 'BenchmarkDotNet.Artifacts/results/*.html'
        reporter: java-junit
        fail-on-error: false

    - name: Store benchmark results
      uses: benchmark-action/github-action-benchmark@v1
      if: github.event_name != 'pull_request'
      with:
        name: .NET Benchmarks
        tool: 'benchmarkdotnet'
        output-file-path: BenchmarkDotNet.Artifacts/results/BenchmarkRun-*.html
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true

  load-test:
    name: Load Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup k6
      run: |
        curl https://github.com/grafana/k6/releases/download/v0.45.0/k6-v0.45.0-linux-amd64.tar.gz -L | tar xvz
        sudo mv k6-v0.45.0-linux-amd64/k6 /usr/local/bin/

    - name: Run load tests
      run: |
        k6 run --out json=load-test-results.json tests/load/load-test.js

    - name: Upload load test results
      uses: actions/upload-artifact@v4
      with:
        name: load-test-results
        path: load-test-results.json