apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-timeline-api
  namespace: doolittle-health
  labels:
    app: patient-timeline-api
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patient-timeline-api
  template:
    metadata:
      labels:
        app: patient-timeline-api
        component: api
    spec:
      containers:
      - name: api
        image: doolittlehealth/patient-timeline-api:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: patient-timeline-secrets
              key: database-connection
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: patient-timeline-data-pvc
