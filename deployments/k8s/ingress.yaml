apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: patient-timeline-ingress
  namespace: doolittle-health
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - patient-timeline.doolittle.health
    secretName: patient-timeline-tls
  rules:
  - host: patient-timeline.doolittle.health
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: patient-timeline-web-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: patient-timeline-api-service
            port:
              number: 80
